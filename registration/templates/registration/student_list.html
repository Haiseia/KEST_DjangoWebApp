<!DOCTYPE html>

<html> <head> <title>Student List</title> </head> <body>

<h1>Student List</h1>

<a href="{% url 'student_create' %}">Register Student</a>

<br><br>

{% if students %}

    <table border="1">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Program</th>
        </tr>

        {% for student in students %}
        <tr>
            <td>{{ student.id }}</td>
            <td>{{ student.student_name }}</td>
            <td>{{ student.program }}</td>

            <td>
                <a href="{% url 'student_update' student.id %}">
                    Edit
                </a>

                <a href="{% url 'student_delete' student.id %}">
                    Delete
                </a>
            </td>
        </tr>
        {% endfor %}

    </table>

{% else %}

    <p>No students registered.</p>

{% endif %}

</body> </html>
